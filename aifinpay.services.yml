services:
  aifinpay.middleware:
    class: Drupal\aifinpay\Middleware\PaymentMiddleware
    arguments: ['@config.factory', '@http_client', '@queue', '@logger.factory', '@aifinpay.hosted_gateway', '@aifinpay.edge_replay', '@aifinpay.receipt_gate', '@aifinpay.merchant_record', '@aifinpay.search_bots', '@aifinpay.human_check', '@aifinpay.about_page']
    tags:
      - { name: http_middleware, priority: 250 }
  aifinpay.about_page:
    class: Drupal\aifinpay\Render\AboutPage
    arguments: ['@entity_type.manager', '@path_processor_manager']
  aifinpay.transport:
    class: Drupal\aifinpay\Protocol\Transport
    arguments: ['@http_client']
  aifinpay.hosted_gateway:
    class: Drupal\aifinpay\Protocol\HostedGateway
    arguments: ['@aifinpay.transport', '@cache.default', '@database']
  aifinpay.merchant_record:
    class: Drupal\aifinpay\Connect\MerchantRecord
    arguments: ['@aifinpay.transport', '@cache.default', '@state']
  aifinpay.receipt_gate:
    class: Drupal\aifinpay\Protocol\ReceiptGate
    arguments: ['@aifinpay.transport', '@cache.default', '@database']
  aifinpay.cache_policy:
    class: Drupal\aifinpay\Policy\NoPaidCache
    arguments: ['@config.factory']
    tags:
      - { name: page_cache_request_policy }
      - { name: dynamic_page_cache_request_policy }

  aifinpay.edge_replay:
    class: Drupal\aifinpay\Protocol\EdgeReplayGuard
    arguments: ['@database']
  aifinpay.dns_resolver:
    class: Drupal\aifinpay\Protocol\SystemDnsResolver
  aifinpay.search_bots:
    class: Drupal\aifinpay\Protocol\SearchBots
    arguments: ['@aifinpay.dns_resolver', '@cache.default', '@datetime.time']
  aifinpay.siteverify_client:
    alias: http_client
  aifinpay.human_check:
    class: Drupal\aifinpay\Protocol\HumanCheck
    arguments: ['@aifinpay.siteverify_client']
